name: Build 2S Member APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Gradle Google Maven Mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cat <<'EOF' > ~/.gradle/init.d/maven_central_mirror.gradle
          def central = ~/^https:\/\/(repo\.maven\.apache\.org|repo1\.maven\.org)\/maven2\/?/
          def mirror = 'https://maven-central.storage-download.googleapis.com/maven2/'
          def fallback = 'mavenCentralBehindMirror'

          def addFallback = { RepositoryHandler repositories ->
            repositories.maven {
              name = fallback
              url = 'https://repo.maven.apache.org/maven2/'
            }
          }

          def toMirror = { RepositoryHandler repositories ->
            def hasFallback = false
            repositories.all { repository ->
              if (repository.name == fallback) {
                return
              }
              if (repository instanceof MavenArtifactRepository) {
                def url = repository.url.toString()
                if (url =~ central) {
                  repository.url = url.replaceFirst(central, mirror)
                  if (!hasFallback) {
                    hasFallback = true
                    addFallback(repositories)
                    return
                  }
                }
              }
              def last = repositories.findByName(fallback)
              if (hasFallback && !repositories.last().is(last)) {
                repositories.remove(last)
                repositories.add(last)
              }
            }
          }

          beforeSettings { settings ->
            toMirror(settings.buildscript.repositories)
            toMirror(settings.pluginManagement.repositories)
            toMirror(settings.dependencyResolutionManagement.repositories)
          }

          settingsEvaluated { settings ->
            if (settings.pluginManagement.repositories.isEmpty()) {
              settings.pluginManagement.repositories { repositories ->
                maven { url = mirror }
                addFallback(repositories)
                gradlePluginPortal()
              }
            }
          }

          allprojects { project ->
            toMirror(project.buildscript.repositories)
            toMirror(project.repositories)
          }
          EOF

      - name: Generate Android wrapper if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.duas.service --project-name member_2s /tmp/tpl
            cp -r /tmp/tpl/android ./android
          fi
          if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          fi
          sed -i 's/android:label="member_2s"/android:label="2S Member"/g' android/app/src/main/AndroidManifest.xml
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts
          elif [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2S-Member-APK
          path: build/app/outputs/flutter-apk/app-release.apk
